id = "log-detective"
title = "Capstone: Log Detective"
description = "Use everything so far to answer real questions from a pile of logs."
difficulty = "Advanced"
estimated_minutes = 20
prerequisites = ["pipelines", "find-files"]
tags = ["operator", "capstone", "logs", "grep", "cut", "sort", "uniq", "tee"]

# A small bakery's web shop, three days of logs. Addresses come from the
# ranges set aside for documentation (192.0.2.x, 198.51.100.x, 203.0.113.x).
# The text 500 appears only as a status code, so the counts are unambiguous.

[[setup]]
path = "case/README.txt"
contents = """From Omar, who runs the bakery's web shop:
On Tuesday morning the shop was slow and some people couldn't pay.
Monday and Wednesday were fine. What happened?
"""

[[setup]]
path = "case/logs/web-mon.log"
contents = """2026-03-02 08:45:10 198.51.100.23 GET / 200
