id = "wildcards"
title = "Wildcards: Many Files at Once"
description = "Use * ? and [ ] to work on many files with one command."
difficulty = "Beginner"
estimated_minutes = 12
prerequisites = ["file-mgmt"]
tags = ["operator", "wildcards", "globs", "rm", "echo"]

