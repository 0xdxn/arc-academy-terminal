name: Release

# Builds the prebuilt archives the installer downloads. Runs when a
# version tag (v1.2.3) is pushed, and creates a DRAFT release: a maintainer
# checks it, then publishes it and copies the files to
# arcacademy.sh/releases/vX.Y.Z/ (see RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One target failing must not cancel the others' builds.
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig and cargo-zigbuild (Linux targets)
        if: contains(matrix.target, 'linux')
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: cargo test --workspace --locked

      - name: Package
        run: scripts/package.sh "$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: arct-${{ matrix.target }}
          path: dist/arct-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum arct-*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "arct ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md. Install: curl -fsSL https://arcacademy.sh/install.sh | sh"
