name: Release

# Builds the prebuilt archives the installer downloads. Runs when a
# version tag (v1.2.3) is pushed, and creates a DRAFT release: a maintainer
# checks it, then publishes it and copies the files to
# arcacademy.sh/releases/vX.Y.Z/ (see RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One target failing must not cancel the others' builds.
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10; the toolchain itself is pinned below
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Install zig and cargo-zigbuild (Linux targets)
        if: contains(matrix.target, 'linux')
        run: |
          pip install --require-hashes -r .github/zig-requirements.txt
          cargo install --locked cargo-zigbuild --version 0.23.4

      # The tests prove the OS jail on both platforms: sandbox-exec is always
      # there on macOS; on Linux, bubblewrap needs unprivileged user
      # namespaces, which Ubuntu restricts by default. With
      # ARCT_REQUIRE_JAIL set, a jail that doesn't work fails the release.
      - name: Linux jail (bubblewrap)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        env:
          ARCT_REQUIRE_JAIL: "1"
        run: cargo test --workspace --locked

      - name: Package
        run: scripts/package.sh "$TARGET"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arct-${{ matrix.target }}
          path: dist/arct-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum arct-*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "arct ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md. Install: curl -fsSL https://arcacademy.sh/install.sh | sh"
