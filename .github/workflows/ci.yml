name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# NOTE: `cargo fmt --check` is intentionally not run yet — the tree is not
# currently rustfmt-clean. Once `cargo fmt` has been applied across the
# workspace, add a fmt job:
#
#   fmt:
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v4
#       - uses: dtolnay/rust-toolchain@stable
#         with:
#           components: rustfmt
#       - run: cargo fmt --all --check

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10
        with:
          toolchain: 1.99.0
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Warnings are currently allowed; tighten to `-- -D warnings` once the
      # workspace is clippy-clean
      - name: Clippy
        run: cargo clippy --workspace

      - name: Build
        run: cargo build --workspace

      # The tests prove the OS jail on both systems (see release.yml)
      - name: Linux jail (bubblewrap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Test
        env:
          ARCT_REQUIRE_JAIL: "1"
        run: cargo test --workspace --locked

      - name: Core without the app's records (what the browser build uses)
        run: cargo test -p arct-core --no-default-features

      - name: Browser lesson engine (wasm)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --profile web -p arct-web --target wasm32-unknown-unknown
